version: '3.8'

networks:
  web:
    external: true        # Traefik shu networkda ishlaydi
  internal:
    external: false       # Backend va Frontend o'rtasidagi ichki network

services:

  # ─────────────────────────────────────────────
  # BACKEND  (.NET 8 API)
  # ─────────────────────────────────────────────
  face-back-api:
    container_name: face-back-api
    image: taqsim/face_back:latest
    restart: unless-stopped

    networks:
      - web
      - internal

    environment:
      # DB host serverda (Docker tashqarisida) joylashgan
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=185.183.243.60;Port=5433;Username=postgres;Password=Face2023Taqsim;Database=face_taqsim;Search Path=public

    volumes:
      - /root/face/files:/app/Files

    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      # Traefik /api va /swagger so'rovlarini to'g'ridan-to'g'ri backendga yo'naltiradi
      # priority=10 → face-front dan ustun turadi
      - traefik.http.routers.face-api.rule=Host(`face.taqsim.uz`) && PathPrefix(`/api`,`/swagger`)
      - traefik.http.routers.face-api.priority=10
      - traefik.http.routers.face-api.tls=true
      - traefik.http.routers.face-api.tls.certresolver=lets-encrypt
      - traefik.http.services.face-api.loadbalancer.server.port=80


  # ─────────────────────────────────────────────
  # FRONTEND  (React → Nginx)
  # ─────────────────────────────────────────────
  face-front:
    container_name: face-front
    image: taqsim/face_front:latest
    restart: unless-stopped

    # Agar image qaytadan build qilish kerak bo'lsa:
    # build:
    #   context: ../face-recognize-front-1
    #   args:
    #     REACT_APP_BASE_URL: ""    # ← bo'sh! nginx /api ni backendga proxy qiladi

    networks:
      - web
      - internal

    # REACT_APP_BASE_URL = "" (bo'sh)
    # Axios relative URL ishlaydi: /api/authentication
    # Nginx: /api/* → face-back-api:80  (default.conf da yozilgan)

    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.face-front.rule=Host(`face.taqsim.uz`)
      - traefik.http.routers.face-front.priority=1
      - traefik.http.routers.face-front.tls=true
      - traefik.http.routers.face-front.tls.certresolver=lets-encrypt
      - traefik.http.services.face-front.loadbalancer.server.port=80

    depends_on:
      - face-back-api
