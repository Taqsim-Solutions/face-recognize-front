name: Dockerize and Deploy Face Recognize Front

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  dockerize:
    runs-on: ubuntu-latest
    steps:
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v2.1.0
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2.5.0
      -
        name: Login to DockerHub
        uses: docker/login-action@v2.1.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      -
        name: Build and push
        id: docker_build
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: taqsim/face_front:latest
  deploy:
    runs-on: ubuntu-latest
    needs: dockerize

    steps:
      - name: executing remote ssh commands using keys
        id: deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.FACE_SSH_HOST }}
          username: ${{ secrets.FACE_SSH_USER }}
          password: ${{ secrets.FACE_PASSWORD }}
          port: ${{ secrets.FACE_SSH_PORT }}
          script: |
            echo "Pulling latest docker image and restarting front app..."            
            docker pull taqsim/face_front:latest && docker rm -f face_front && docker-compose up -d face_front
