name: Dockerize and Deploy Face Recognize Frontend

on:
  push:
    branches:
      - 'feature/entity-status'
      
  workflow_dispatch:
env:
  # Image tag: branch nomiga qarab
  IMAGE_TAG: >-
    ${{ github.ref_name == 'feature/entity-status' && 'test'
     || github.ref_name == 'redesign' && 'redesign'
     || 'latest' }}

  # REACT_APP_BASE_URL bo'sh — nginx /api ni backendga proxy qiladi
  # (double /api/api/ muammosini hal qiladi)
  # Har bir branch uchun FAQAT domen, /api YO'Q!
  VITE_BASE_URL: >-
    ${{ github.ref_name == 'feature/entity-status' && 'https://face-test.taqsim.uz'
     || github.ref_name == 'itacademy' && 'https://faceita.taqsim.uz'
     || github.ref_name == 'redesign' && 'https://face.taqsim.uz'
     || '' }}

jobs:
  dockerize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: taqsim/face_front:${{ env.IMAGE_TAG }}
          no-cache: true
          build-args: |
            VITE_BASE_URL=${{ env.VITE_BASE_URL }}
