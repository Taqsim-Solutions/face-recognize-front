name: Dockerize and Deploy Face Recognize Front

on:
  push:
    branches:
      - 'main'
      - '34'
      - 'itacademy'
      - 'local'
env:
  IMAGE_TAG: ${{ github.ref_name == '34' && '34' || github.ref_name == 'itacademy' && 'ita' || github.ref_name == 'local' && 'local' || 'latest' }}     
  REACT_APP_BASE_URL: ${{ github.ref_name == '34' && 'https://face34.taqsim.uz/api' || github.ref_name == 'itacademy' && 'https://faceita.taqsim.uz/api' || github.ref_name == 'local' && 'http://localhost/api' || 'https://face.taqsim.uz/api' }}     

jobs:
  dockerize:
    runs-on: ubuntu-latest
    steps:
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v2.1.0
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2.5.0
      -
        name: Login to DockerHub
        uses: docker/login-action@v2.1.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      -
        name: Build and push
        id: docker_build
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: taqsim/face_front:${{ env.IMAGE_TAG }}
          no-cache: true
          build-args: |
            REACT_APP_BASE_URL=${{ env.REACT_APP_BASE_URL }}
