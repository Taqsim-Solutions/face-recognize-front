name: Dockerize and Deploy Face Recognize Frontend

on:
  push:
    branches:
      - 'main'
      - 'redesign'
      
  workflow_dispatch:
env:
  # Image tag: branch nomiga qarab
  IMAGE_TAG: >-
    ${{ github.ref_name == '34' && '34'
     || github.ref_name == 'redesign' && 'redesign'
     || 'latest' }}

  # REACT_APP_BASE_URL bo'sh — nginx /api ni backendga proxy qiladi
  # (double /api/api/ muammosini hal qiladi)
  # Har bir branch uchun FAQAT domen, /api YO'Q!
  REACT_APP_BASE_URL: >-
    ${{ github.ref_name == '34' && 'https://face34.taqsim.uz'
     || github.ref_name == 'itacademy' && 'https://faceita.taqsim.uz'
     || github.ref_name == 'redesign' && 'https://face.taqsim.uz'
     || '' }}

jobs:
  dockerize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: taqsim/face_front:${{ env.IMAGE_TAG }}
          no-cache: true
          build-args: |
            REACT_APP_BASE_URL=${{ env.REACT_APP_BASE_URL }}

  deploy:
    runs-on: ubuntu-latest
    needs: dockerize
    # Faqat main branchda deploy qiladi
    if: github.ref_name == 'redesign'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          command_timeout: 20m
          host: ${{ secrets.MAIN_SSH_HOST }}
          username: ${{ secrets.MAIN_SSH_USER }}
          key: ${{ secrets.MAIN_SSH_PRIVATE_KEY }}
          port: ${{ secrets.MAIN_SSH_PORT }}
          script: |
            cd ~/traefik
            docker rm --force /face-front
            docker pull taqsim/face_front:latest
            docker compose up -d face-front
